name: Release

# Push a tag such as v0.1.0 to publish. The tag has to match <Version> in Directory.Build.props. Running the workflow by
# hand builds the packages and zips without publishing them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Spek.NET tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download ffmpeg
        shell: pwsh
        run: ./scripts/Get-Ffmpeg.ps1 -Architecture x64
      - name: Run the tests
        env:
          FLUENTSPEK_FFMPEG: ${{ github.workspace }}\ffmpeg\win-x64\ffmpeg.exe
        run: dotnet test tests/Spek.Net.Tests/Spek.Net.Tests.csproj -c Release

  packages:
    name: NuGet packages
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "The tag ${{ github.ref_name }} doesn't match version $version in Directory.Build.props."
          }
      - name: Pack Spek.NET and Spek.NET.WinUI
        run: dotnet pack FluentSpek.slnx -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  app:
    name: FluentSpek (${{ matrix.platform }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download ffmpeg
        shell: pwsh
        run: ./scripts/Get-Ffmpeg.ps1 -Architecture ${{ matrix.platform }}
      - name: Publish
        run: dotnet publish src/FluentSpek/FluentSpek.csproj -c Release -p:Platform=${{ matrix.platform }} -o publish/FluentSpek
      - name: Zip
        shell: pwsh
        run: |
          if (-not (Test-Path publish/FluentSpek/ffmpeg/ffmpeg.exe)) { throw 'ffmpeg.exe is missing from the published app.' }
          New-Item -ItemType Directory artifacts | Out-Null
          Compress-Archive -Path publish/FluentSpek -DestinationPath "artifacts/FluentSpek-${{ github.ref_name }}-win-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.platform }}
          path: artifacts/*.zip
          if-no-files-found: error

  publish:
    name: Publish to nuget.org and GitHub
    if: startsWith(github.ref, 'refs/tags/')
    needs: [packages, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # Trusted Publishing to nuget.org
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # nuget.org trades the workflow's OIDC token for an API key that lasts an hour. NUGET_USER is the nuget.org
      # profile name, not the email address.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --title "FluentSpek ${TAG#v}" --generate-notes $prerelease
