name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Spek.NET tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ffmpeg
          key: ffmpeg-x64-${{ hashFiles('scripts/Get-Ffmpeg.ps1') }}
      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/Get-Ffmpeg.ps1 -Architecture x64
      - name: Run the tests
        env:
          FLUENTSPEK_FFMPEG: ${{ github.workspace }}\ffmpeg\win-x64\ffmpeg.exe
        run: dotnet test tests/Spek.Net.Tests/Spek.Net.Tests.csproj -c Release

  build:
    name: App build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the app
        run: dotnet build src/FluentSpek/FluentSpek.csproj -c Release -p:Platform=${{ matrix.platform }}
